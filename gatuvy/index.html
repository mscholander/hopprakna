<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatuvy – åk genom staden</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 16px; left: 16px; width: min(380px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); overflow: auto;
    background: rgba(18,18,22,.88); backdrop-filter: blur(8px); border: 1px solid #333;
    border-radius: 12px; padding: 16px; transition: opacity .4s; z-index: 5; }
  body.collapsed #panel { opacity: 0; pointer-events: none; }
  #min { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; padding: 0; margin: 0; font-size: 20px; line-height: 1; }
  #open { position: fixed; top: 14px; left: 14px; width: 44px; height: 44px; padding: 0; margin: 0; z-index: 6;
    border-radius: 50%; background: rgba(18,18,22,.75); border: 1px solid #555; font-size: 20px;
    display: none; transition: opacity .4s; }
  body.collapsed #open { display: block; }
  body.idle #open { opacity: 0; } body.idle { cursor: none; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
  input, select, button { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #444;
    background: #1c1c22; color: #eee; font: inherit; }
  button { cursor: pointer; background: #2b6cff; border-color: #2b6cff; font-weight: 600; margin-top: 14px; }
  button.secondary { background: #1c1c22; border-color: #444; font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  #status { margin-top: 12px; font-size: 13px; color: #bbb; min-height: 1.4em; white-space: pre-line; }
  #status.error { color: #ff8a8a; }
  #credit { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: #ddd;
    background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 6px; z-index: 3; max-width: 70vw; }
  #place { position: fixed; left: 16px; bottom: 150px; font-size: 13px; color: #fff;
    text-shadow: 0 1px 4px #000; z-index: 3; }
  canvas#mini { position: fixed; left: 16px; bottom: 16px; width: 180px; height: 126px;
    background: rgba(0,0,0,.45); border-radius: 10px; z-index: 3; }
  .playing-only { display: none; } body.playing .playing-only { display: block; }
  small { color: #888; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="mini" class="playing-only" width="360" height="252"></canvas>
<div id="place" class="playing-only"></div>
<div id="credit" class="playing-only"></div>

<button id="open" title="Visa inställningar" aria-label="Visa inställningar">☰</button>
<div id="panel">
  <button id="min" class="secondary" title="Minimera" aria-label="Minimera panelen">–</button>
  <h1>Gatuvy – åk genom staden</h1>
  <label>Färdig rutt</label>
  <select id="preset"></select>
  <label>Start</label>
  <input id="from" placeholder="Adress eller plats">
  <label>Mål</label>
  <input id="to" placeholder="Adress eller plats">
  <div class="row">
    <div><label>Bildkälla</label>
      <select id="provider">
        <option value="panoramax">Panoramax (öppen, ingen nyckel)</option>
        <option value="mapillary">Mapillary (kräver token)</option>
      </select></div>
    <div><label>Kvalitet</label>
      <select id="quality"><option value="sd">Normal</option><option value="hd">Hög (tyngre)</option></select></div>
  </div>
  <div id="tokenRow" style="display:none">
    <label>Mapillary access token</label>
    <input id="token" placeholder="MLY|...">
  </div>
  <div class="row">
    <div><label>Tempo (sek per bild)</label>
      <select id="tempo"><option>0.5</option><option selected>0.9</option><option>1.5</option><option>2.5</option></select></div>
    <div><label>Musik</label>
      <select id="music">
        <option value="">Ingen</option>
        <option value="https://ice1.somafm.com/groovesalad-128-mp3">Lounge (SomaFM Groove Salad)</option>
        <option value="https://ice1.somafm.com/beatblender-128-mp3">Deep house (SomaFM Beat Blender)</option>
        <option value="https://ice1.somafm.com/lush-128-mp3">Mjuk vokal (SomaFM Lush)</option>
        <option value="custom">Egen ström-URL…</option>
      </select></div>
  </div>
  <input id="musicUrl" placeholder="https://…/stream.mp3" style="display:none; margin-top:8px">
  <button id="go">Starta resan</button>
  <div class="row">
    <button id="fs" class="secondary">Helskärm</button>
    <button id="stop" class="secondary">Stopp</button>
  </div>
  <div id="status"></div>
  <small>Panelen minimeras när resan startar – tryck på ☰ för att öppna den igen. Rutten loopar.</small>
</div>
<audio id="audio" preload="none"></audio>

<script>
'use strict';
const $ = id => document.getElementById(id);
const PRESETS = [
  ['Paris: Louvren → Triumfbågen', 'Musée du Louvre, Paris', 'Arc de Triomphe, Paris'],
  ['Paris: Notre-Dame → Eiffeltornet', 'Notre-Dame de Paris', 'Tour Eiffel, Paris'],
  ['Lyon: Bellecour → Part-Dieu', 'Place Bellecour, Lyon', 'Gare de Lyon-Part-Dieu'],
  ['Nice: Promenade des Anglais', 'Aéroport Nice Côte d\'Azur', 'Place Masséna, Nice'],
  ['Stockholm: Slussen → Odenplan', 'Slussen, Stockholm', 'Odenplan, Stockholm'],
];
PRESETS.forEach((p, i) => $('preset').add(new Option(p[0], i)));
$('preset').add(new Option('Egen rutt…', -1));

// ---------- geo helpers ----------
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) { // metres, equirectangular approximation (fine at city scale)
  const x = rad(b[0] - a[0]) * Math.cos(rad((a[1] + b[1]) / 2)), y = rad(b[1] - a[1]);
  return Math.hypot(x, y) * R;
}
function bearing(a, b) {
  const x = rad(b[0] - a[0]) * Math.cos(rad((a[1] + b[1]) / 2)), y = rad(b[1] - a[1]);
  return (deg(Math.atan2(x, y)) + 360) % 360;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

function resample(coords, step) { // -> [{p:[lon,lat], brg, d}]
  const out = []; let carry = 0, total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i], b = coords[i + 1], len = dist(a, b);
    if (len < 0.01) continue;
    const brg = bearing(a, b);
    for (let s = carry; s < len; s += step) {
      const t = s / len;
      out.push({ p: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], brg, d: total + s });
    }
    carry = (carry - len) % step; if (carry < 0) carry += step;
    total += len;
  }
  // smooth bearing a little so the camera does not snap in corners
  for (let i = 0; i < out.length; i++) {
    let sx = 0, sy = 0;
    for (let k = -3; k <= 3; k++) { const o = out[Math.min(out.length - 1, Math.max(0, i + k))]; sx += Math.sin(rad(o.brg)); sy += Math.cos(rad(o.brg)); }
    out[i].sbrg = (deg(Math.atan2(sx, sy)) + 360) % 360;
  }
  return out;
}

// ---------- external services ----------
async function getJSON(url) {
  const host = new URL(url).host;
  let r;
  try { r = await fetch(url); }
  catch (e) { throw new Error(`Kunde inte nå ${host}. Om sidan visas i en förhandsgranskning eller inbäddad vy blockeras ofta nätverket – öppna den i en vanlig webbläsarflik.`); }
  if (!r.ok) throw new Error(`${host} svarade ${r.status}`);
  return r.json();
}
async function geocode(q) {
  const m = q.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/); // "lat, lon"
  if (m) return [parseFloat(m[3]), parseFloat(m[1])];
  let lastErr;
  try {
    const j = await getJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    if (j.length) return [parseFloat(j[0].lon), parseFloat(j[0].lat)];
  } catch (e) { lastErr = e; console.warn(e); }
  try { // backup geocoder
    const j = await getJSON('https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(q));
    if (j.features && j.features.length) return j.features[0].geometry.coordinates;
  } catch (e) { lastErr = e; console.warn(e); }
  throw lastErr || new Error(`Hittade inte platsen "${q}"`);
}
async function route(a, b) {
  const path = `/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=full&geometries=geojson`;
  // Two public OSRM demo servers; fall back to the second if the first is busy.
  let lastErr;
  for (const base of ['https://router.project-osrm.org', 'https://routing.openstreetmap.de/routed-car']) {
    try { const j = await getJSON(base + path); if (j.code === 'Ok') return j.routes[0]; } catch (e) { lastErr = e; console.warn(e); }
  }
  throw lastErr || new Error('Kunde inte räkna ut en rutt');
}

// Image providers: each returns normalised {id, p:[lon,lat], az, pano, seq, sd, hd, credit}
const providers = {
  async panoramax(bbox) {
    const j = await getJSON(`https://api.panoramax.xyz/api/search?limit=3000&bbox=${bbox.join(',')}`);
    return (j.features || []).map(f => {
      const pr = f.properties, fov = (pr['pers:interior_orientation'] || {}).field_of_view;
      return { id: f.id, p: f.geometry.coordinates, az: pr['view:azimuth'], pano: fov === 360,
        seq: f.collection, sd: f.assets.sd.href, hd: f.assets.hd.href, t: Date.parse(pr.datetime) || 0,
        credit: `${pr['geovisio:producer'] || 'okänd'} · ${pr.license || ''} · Panoramax` };
    });
  },
  async mapillary(bbox) {
    const tok = $('token').value.trim();
    const j = await getJSON('https://graph.mapillary.com/images?limit=2000&fields=id,geometry,compass_angle,computed_compass_angle,is_pano,camera_type,width,height,sequence,thumb_2048_url,thumb_original_url,captured_at,creator'
      + `&bbox=${bbox.join(',')}&access_token=${encodeURIComponent(tok)}`);
    return (j.data || []).map(f => ({ id: f.id, p: f.geometry.coordinates, az: f.computed_compass_angle ?? f.compass_angle,
      pano: !!f.is_pano || f.camera_type === 'spherical' || f.camera_type === 'equirectangular',
      portrait: f.height > f.width, fisheye: f.camera_type === 'fisheye',
      seq: f.sequence, sd: f.thumb_2048_url, hd: f.thumb_original_url || f.thumb_2048_url, t: f.captured_at || 0,
      credit: `${(f.creator || {}).username || 'okänd'} · CC BY-SA · Mapillary` }));
  },
};

async function fetchImagesAlong(samples, provider, onProgress) {
  // Split the route into ~150 m chunks and ask for the images inside each chunk's padded bounding box.
  const chunks = []; let cur = null, startD = 0;
  for (const s of samples) {
    if (!cur || s.d - startD > 150) { cur = [1e9, 1e9, -1e9, -1e9]; chunks.push(cur); startD = s.d; }
    cur[0] = Math.min(cur[0], s.p[0]); cur[1] = Math.min(cur[1], s.p[1]);
    cur[2] = Math.max(cur[2], s.p[0]); cur[3] = Math.max(cur[3], s.p[1]);
  }
  const byId = new Map(); let done = 0, failed = 0, next = 0;
  async function worker() {
    while (next < chunks.length) {
      const c = chunks[next++];
      const padLat = 20 / 111320, padLon = padLat / Math.cos(rad(c[1]));
      const bbox = [c[0] - padLon, c[1] - padLat, c[2] + padLon, c[3] + padLat].map(v => v.toFixed(6));
      try { for (const im of await providers[provider](bbox)) if (im.az != null || im.pano) byId.set(im.id, im); }
      catch (e) { failed++; console.warn(e); }
      onProgress(++done, chunks.length);
    }
  }
  await Promise.all(Array.from({ length: 4 }, worker));
  if (failed === chunks.length) throw new Error('Bildkällan svarade inte (kontrollera token/nätverk)');
  return [...byId.values()];
}

// Which way was the photographer actually moving? Work it out from the neighbouring photos in the
// same capture run. A camera that points far away from that direction is a side or rear camera.
function markForwardFacing(images) {
  const bySeq = new Map();
  for (const im of images) (bySeq.get(im.seq) || bySeq.set(im.seq, []).get(im.seq)).push(im);
  for (const list of bySeq.values()) {
    list.sort((a, b) => a.t - b.t);
    for (let i = 0; i < list.length; i++) {
      const im = list[i];
      // look 1-3 photos back and ahead so tiny GPS jitter does not decide the direction
      let a = null, b = null;
      for (let k = 1; k <= 3 && !a; k++) { const c = list[i - k]; if (c && dist(c.p, im.p) > 2) a = c; }
      for (let k = 1; k <= 3 && !b; k++) { const c = list[i + k]; if (c && dist(c.p, im.p) > 2) b = c; }
      im.move = (a || b) ? bearing((a || im).p, (b || im).p) : null;
      im.forward = im.pano || (im.az != null && im.move != null && angDiff(im.az, im.move) <= 25);
    }
  }
}

// Score of a whole capture run for this route: how many route points it can serve looking forward.
const FLAT_MAX_TURN = 20; // flat photo may look at most this many degrees away from the road
function usable(im, s) {
  if (im.portrait || im.fisheye) return false;
  if (im.pano) return true;
  return im.forward && angDiff(im.az, s.brg) <= FLAT_MAX_TURN;
}

function buildFrames(samples, images) {
  markForwardFacing(images);
  // Spatial grid (~20 m cells) for nearest-image lookups.
  const lat0 = samples[0].p[1], kx = Math.cos(rad(lat0)) * 111320, ky = 111320, CELL = 20;
  const key = (x, y) => x + ':' + y, grid = new Map();
  for (const im of images) {
    const k = key(Math.floor(im.p[0] * kx / CELL), Math.floor(im.p[1] * ky / CELL));
    (grid.get(k) || grid.set(k, []).get(k)).push(im);
  }
  const near = s => { const cx = Math.floor(s.p[0] * kx / CELL), cy = Math.floor(s.p[1] * ky / CELL), out = [];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const im of grid.get(key(cx + dx, cy + dy)) || [])
      if (dist(s.p, im.p) <= 14 && usable(im, s)) out.push(im);
    return out; };
  const cand = samples.map(near);

  // Is one kind of picture (360° or flat) good enough for the whole route? Then use only that,
  // so the look of the "camera" never changes along the way.
  const cov = kind => cand.filter(c => c.some(im => im.pano === kind)).length / samples.length;
  const covPano = cov(true), covFlat = cov(false);
  const only = covPano >= 0.8 ? true : covFlat >= 0.8 ? false : covPano >= covFlat + 0.25 ? true : covFlat >= covPano + 0.25 ? false : null;

  // Long runs from the same capture keep light, season and camera height the same.
  const seqLen = new Map();
  cand.forEach(c => new Set(c.map(im => im.seq)).forEach(q => seqLen.set(q, (seqLen.get(q) || 0) + 1)));

  const frames = []; let prev = null, covered = 0, runDir = 0;
  samples.forEach((s, n) => {
    let best = null, bestScore = 1e9;
    for (const im of cand[n]) {
      if (only !== null && im.pano !== only) continue;         // one camera kind for the whole trip
      let score = dist(s.p, im.p);
      if (!im.pano) score += angDiff(im.az, s.brg) * 0.15;     // the straighter ahead, the better
      if (prev && im.seq !== prev.seq) score += 15;           // switching capture run = visible jump
      if (prev && im.pano !== prev.pano) score += 15;         // switching camera kind = bigger jump
      score -= Math.min(8, (seqLen.get(im.seq) || 0) * 4 / samples.length * 8);
      if (prev && im.id === prev.id) score -= 1;
      // A run may have been driven the other way (fine for 360°), but it must not change direction under us.
      if (prev && im.seq === prev.seq && im.id !== prev.id && runDir && Math.sign(im.t - prev.t) !== runDir) score += 20;
      if (score < bestScore) { bestScore = score; best = im; }
    }
    if (!best) return;
    covered++;
    if (prev && best.id === prev.id) return;
    runDir = prev && best.seq === prev.seq ? Math.sign(best.t - prev.t) : 0;
    frames.push({ im: best, brg: s.sbrg, road: s.brg, cx: 0, cy: 0, p: s.p, d: s.d });
    prev = best;
  });
  return { frames, coverage: covered / samples.length };
}

// ---------- WebGL renderer: cross-fades two images, re-projects 360° panoramas ----------
const canvas = $('view'), gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
const VS = `#version 300 es
in vec2 a; out vec2 v; void main(){ v = a; gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D t0, t1;
uniform vec4 m0, m1;      // x: isPano, y: yaw, z: zoom, w: image aspect
uniform vec2 o0, o1;      // stabilisation offset (pano: y = pitch, flat: image-fraction shift)
uniform float mixv, aspect;
const float PI = 3.14159265;
const float HOR = .08;    // screen height of the horizon / vanishing point; all zooming happens around it
vec3 samp(sampler2D t, vec4 m, vec2 off) {
  vec2 p = v - vec2(0., HOR);
  if (m.x > .5) {
    float f = tan(radians(46.)) / m.z;                  // ~92° horizontal field of view at zoom 1
    vec3 d = normalize(vec3(p.x * f, p.y * f / aspect + off.y, 1.));
    float lon = atan(d.x, d.z) + m.y, lat = asin(d.y);
    return texture(t, vec2(lon / (2. * PI) + .5, .5 - lat / PI)).rgb;
  }
  vec2 s = aspect > m.w ? vec2(1., m.w / aspect) : vec2(aspect / m.w, 1.);   // "cover" fit
  vec2 uv = p * s / m.z * .5 + .5;
  return texture(t, clamp(vec2(uv.x + off.x, 1. - uv.y + off.y), 0., 1.)).rgb;
}
void main() {
  vec3 c = mix(samp(t0, m0, o0), samp(t1, m1, o1), mixv);
  float vig = smoothstep(1.5, .5, length(v));
  o = vec4(c * mix(.8, 1., vig), 1.);
}`;
let prog, U = {};
function initGL() {
  if (!gl) throw new Error('Webbläsaren saknar WebGL2');
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'a'); gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['t0', 't1', 'm0', 'm1', 'o0', 'o1', 'mixv', 'aspect']) U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(U.t0, 0); gl.uniform1i(U.t1, 1);
}
function makeTexture(img) {
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE); let src = img;
  if (img.naturalWidth > max) { // downscale oversized panoramas
    const c = document.createElement('canvas'); c.width = max; c.height = Math.round(img.naturalHeight * max / img.naturalWidth);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); src = c;
  }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
// Draw frame a (and b on top with opacity mixv). W = compass direction (deg) the camera looks in.
function draw(a, b, mixv, za, zb, W) {
  const w = canvas.clientWidth * Math.min(devicePixelRatio, 2) | 0, h = canvas.clientHeight * Math.min(devicePixelRatio, 2) | 0;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  const set = (unit, um, uo, f, z) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, f.tex);
    gl.uniform4f(um, f.im.pano ? 1 : 0, f.im.pano ? rad(W - (f.im.az || 0)) + f.cx : 0, z, f.aspect);
    gl.uniform2f(uo, f.im.pano ? 0 : f.cx, f.cy); };
  set(0, U.m0, U.o0, a, za); set(1, U.m1, U.o1, b || a, zb);
  gl.uniform1f(U.mixv, b ? mixv : 0); gl.uniform1f(U.aspect, w / h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- stabilisation: line the next image up with the current one ----------
// A small grey thumbnail of what is straight ahead is taken from both images and slid around
// until they match. The far end of the street barely changes between two shots, so the best
// match tells us how much the new image must be turned/shifted to keep the scene steady.
const CW = 64, CH = 36, DEG_PX = 0.75;
const cropCtx = Object.assign(document.createElement('canvas'), { width: CW, height: CH }).getContext('2d', { willReadFrequently: true });
function crop(f, W, cx, cy) {
  const img = f.img, iw = img.naturalWidth, ih = img.naturalHeight; let ww, hh, x, y;
  cropCtx.fillStyle = '#777'; cropCtx.fillRect(0, 0, CW, CH);
  if (f.im.pano) {
    ww = iw * CW * DEG_PX / 360; hh = ih * CH * DEG_PX / 180;
    const frac = (((rad(W - (f.im.az || 0)) + cx) / (2 * Math.PI) + 0.5) % 1 + 1) % 1;
    x = frac * iw - ww / 2; y = ih / 2 - cy / Math.PI * ih - hh / 2;
    for (const k of [-1, 0, 1]) cropCtx.drawImage(img, x + k * iw, y, ww, hh, 0, 0, CW, CH);
  } else {
    ww = iw / 2; hh = ih / 2;
    cropCtx.drawImage(img, (0.5 + cx) * iw - ww / 2, (0.5 + cy) * ih - hh / 2, ww, hh, 0, 0, CW, CH);
  }
  const d = cropCtx.getImageData(0, 0, CW, CH).data, g = new Float32Array(CW * CH); let mean = 0;
  for (let i = 0; i < g.length; i++) { g[i] = d[i * 4] * .3 + d[i * 4 + 1] * .6 + d[i * 4 + 2] * .1; mean += g[i]; }
  mean /= g.length; let sd = 0;
  for (let i = 0; i < g.length; i++) { g[i] -= mean; sd += g[i] * g[i]; }
  sd = Math.sqrt(sd / g.length) || 1;
  for (let i = 0; i < g.length; i++) g[i] /= sd;

}
function matchShift(A, B) { // finds (dx,dy) so that B(x+dx, y+dy) ≈ A(x, y)
  const RX = 11, RY = 5, cost = (dx, dy) => { let s = 0;
    for (let y = 6; y < 30; y++) for (let x = 12; x < 52; x++) s += Math.abs(A[y * CW + x] - B[(y + dy) * CW + x + dx]);
    return s; };
  let best = 1e18, bx = 0, by = 0, sum = 0, n = 0; const tab = new Map();
  for (let dy = -RY; dy <= RY; dy++) for (let dx = -RX; dx <= RX; dx++) {
    const c = cost(dx, dy); tab.set(dx + ':' + dy, c); sum += c; n++;
    if (c < best) { best = c; bx = dx; by = dy; }
  }
  if (best > 0.8 * sum / n) return null;               // no clear match -> leave the image alone
  const sub = (l, c, r) => (l == null || r == null || l + r - 2 * c <= 0) ? 0 : 0.5 * (l - r) / (l + r - 2 * c);
  return { dx: bx + sub(tab.get((bx - 1) + ':' + by), best, tab.get((bx + 1) + ':' + by)),

}
const clamp = (v, m) => Math.max(-m, Math.min(m, v));
function align(a, b) { // sets b.cx / b.cy so that b lines up with a (as a is currently shown)
  b.cx = b.cy = 0;
  if (!a || !a.img || !b.img || a.im.pano !== b.im.pano) return;
  try {
    const m = matchShift(crop(a, a.brg, a.cx, a.cy), crop(b, a.brg, 0, 0));
    if (!m) return;
    // 0.9: slowly drift back to what the metadata says, so errors cannot pile up.
    if (b.im.pano) { b.cx = clamp(0.9 * rad(m.dx * DEG_PX), rad(8)); b.cy = clamp(-0.9 * rad(m.dy * DEG_PX), rad(4)); }
    else { b.cx = clamp(0.9 * m.dx * 0.5 / CW, 0.07); b.cy = clamp(0.9 * m.dy * 0.5 / CH, 0.07); }
  } catch (e) { console.warn(e); }
}

// ---------- playback ----------
let run = 0; // increments on every start/stop so stale loops exit
const AHEAD = 5;
function loadFrame(f, quality) {
  if (f.loading) return f.loading;
  return f.loading = new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => { f.tex = makeTexture(img); f.img = img; f.aspect = img.naturalWidth / img.naturalHeight; f.ok = true; res(); };
    img.onerror = () => { f.ok = false; res(); };
    img.src = quality === 'hd' ? f.im.hd : f.im.sd;
  });
}
function freeFrame(f) { if (f.tex) gl.deleteTexture(f.tex); f.tex = f.img = f.loading = null; }

// Each image keeps growing at a steady rate while it is on screen, as if we drive into it.
// The outgoing image is always "Z" times more zoomed than the incoming one, which is the size
// difference between two photos taken a few metres apart - so the two overlap while they dissolve.
const FLAT_BASE = 1.3, DEPTH = 22; // DEPTH: assumed distance (m) to the scenery that should line up
async function play(frames, routeCoords, label) {
  const my = ++run, quality = $('quality').value;
  document.body.classList.add('playing');
  const gaps = frames.slice(1).map((f, n) => dist(frames[n].im.p, f.im.p)).sort((x, y) => x - y);
  const medGap = Math.max(1, gaps[gaps.length >> 1] || 4);
  const base = f => f.im.pano ? 1 : FLAT_BASE;
  let i = 0, cur = null;
  while (run === my) {
    for (let k = 0; k < AHEAD; k++) loadFrame(frames[(i + k) % frames.length], quality);
    const nxt = frames[i % frames.length];
    await nxt.loading;
    if (run !== my) return;
    if (nxt.ok && !nxt.im.pano && nxt.aspect < 1.1) nxt.ok = false; // portrait phone photo: skip
    if (nxt.ok && nxt !== cur) {
      align(cur, nxt);
      $('credit').textContent = '© ' + nxt.im.credit;
      $('place').textContent = label;
      drawMini(routeCoords, nxt.p);
      const gap = cur ? Math.min(12, Math.max(1, dist(cur.im.p, nxt.im.p))) : medGap;
      let Z = Math.min(1.5, DEPTH / (DEPTH - gap));
      if (cur && !(cur.im.pano && nxt.im.pano)) Z = Math.min(Z, 1.18);
      const dur = parseFloat($('tempo').value) * 1000 * Math.min(2.2, Math.max(0.5, gap / medGap));
      const turn = cur ? ((nxt.brg - cur.brg + 540) % 360) - 180 : 0, t0 = performance.now();
      await new Promise(done => {
        (function tick(now) {
          if (run !== my) return done();
          const t = Math.min(1, (now - t0) / dur), u = Math.min(1, Math.max(0, (t - .15) / .7)), e = u * u * (3 - 2 * u);
          if (cur) draw(cur, nxt, e, base(cur) * Math.pow(Z, t), base(nxt) * Math.pow(Z, t - 1), cur.brg + turn * t);
          else draw(nxt, null, 0, base(nxt), 1, nxt.brg);
          t < 1 ? requestAnimationFrame(tick) : done();
        })(t0);
      });
      if (cur) freeFrame(cur);
      cur = nxt;
    }
    i++;
  }
}
function stop() { run++; document.body.classList.remove('playing'); $('audio').pause(); setCollapsed(false); }

function drawMini(coords, pos) {
  const c = $('mini'), g = c.getContext('2d'), W = c.width, H = c.height, pad = 18;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; const k = Math.cos(rad(coords[0][1]));
  for (const p of coords) { x0 = Math.min(x0, p[0] * k); x1 = Math.max(x1, p[0] * k); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const s = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1));
  const X = p => pad + (p[0] * k - x0) * s + (W - 2 * pad - (x1 - x0) * s) / 2, Y = p => H - pad - (p[1] - y0) * s - (H - 2 * pad - (y1 - y0) * s) / 2;
  g.clearRect(0, 0, W, H); g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineJoin = 'round'; g.beginPath();
  coords.forEach((p, n) => n ? g.lineTo(X(p), Y(p)) : g.moveTo(X(p), Y(p))); g.stroke();
  g.fillStyle = '#2b6cff'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(X(pos), Y(pos), 8, 0, 7); g.fill(); g.stroke();
}

// ---------- UI ----------
function status(msg, err) { $('status').textContent = msg; $('status').classList.toggle('error', !!err); }
let hideTimer;
function setCollapsed(c) { document.body.classList.toggle('collapsed', c); showPanel(); }
function showPanel() { // wake the "open" button and cursor; hide them again after a while during playback
  document.body.classList.remove('idle'); clearTimeout(hideTimer);
  if (document.body.classList.contains('playing') && document.body.classList.contains('collapsed'))
    hideTimer = setTimeout(() => document.body.classList.add('idle'), 3500);
}
addEventListener('mousemove', showPanel); addEventListener('touchstart', showPanel, { passive: true });
$('min').onclick = () => setCollapsed(true); $('open').onclick = () => setCollapsed(false);

function applyPreset() {
  const p = PRESETS[$('preset').value]; if (p) { $('from').value = p[1]; $('to').value = p[2]; }
}
$('preset').onchange = applyPreset;
$('from').oninput = $('to').oninput = () => { $('preset').value = -1; };
$('provider').onchange = () => { $('tokenRow').style.display = $('provider').value === 'mapillary' ? '' : 'none'; localStorage.setItem('provider', $('provider').value); };
// The token is remembered in this browser. It can also be given once in the address: ?token=MLY|...
if (new URLSearchParams(location.search).get('token')) localStorage.setItem('mlyToken', new URLSearchParams(location.search).get('token'));
$('token').value = localStorage.getItem('mlyToken') || '';
$('token').oninput = () => localStorage.setItem('mlyToken', $('token').value.trim());
$('music').onchange = () => { $('musicUrl').style.display = $('music').value === 'custom' ? '' : 'none'; startMusic(); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('stop').onclick = stop;

function startMusic() {
  const a = $('audio'), v = $('music').value, url = v === 'custom' ? $('musicUrl').value.trim() : v;
  if (!url || !document.body.classList.contains('playing')) { a.pause(); return; }
  if (a.src !== url) a.src = url;
  a.volume = 0.6; a.play().catch(() => {});
}

async function start() {
  const from = $('from').value.trim(), to = $('to').value.trim(), provider = $('provider').value;
  if (!from || !to) return status('Ange både start och mål.', true);
  if (provider === 'mapillary') {
    if (!$('token').value.trim()) return status('Mapillary kräver en access token (gratis på mapillary.com/dashboard/developers).', true);
    localStorage.setItem('mlyToken', $('token').value.trim());
  }
  run++; document.body.classList.remove('playing'); $('go').disabled = true;
  try {
    status('Söker platser…');
    const a = await geocode(from), b = await geocode(to);
    status('Räknar ut rutt…');
    const r = await route(a, b), coords = r.geometry.coordinates;
    if (r.distance > 40000) throw new Error('Rutten är över 4 mil – välj en kortare sträcka i den här MVP:n.');
    const samples = resample(coords, 4);
    const images = await fetchImagesAlong(samples, provider, (d, n) => status(`Hämtar gatubilder… ${d}/${n}`));
    const { frames, coverage } = buildFrames(samples, images);
    if (frames.length < 5) throw new Error(`Hittade för få gatubilder längs rutten (${frames.length}). Prova en annan sträcka eller bildkälla.`);
    status(`${(r.distance / 1000).toFixed(1)} km · ${frames.length} bilder · täckning ${Math.round(coverage * 100)} %`);
    $('go').disabled = false;
    const q = new URLSearchParams({ from, to, provider, autoplay: 1 }); history.replaceState(null, '', '?' + q);
    document.body.classList.add('playing'); startMusic(); setCollapsed(true);
    play(frames, coords, `${from} → ${to}`);
  } catch (e) { console.error(e); status(e.message || String(e), true); $('go').disabled = false; }
}
$('go').onclick = start;

try { initGL(); } catch (e) { status(e.message, true); }
// Kiosk mode: index.html?from=...&to=...&autoplay=1[&provider=mapillary&tempo=0.9]
const qs = new URLSearchParams(location.search);
if (qs.get('from')) { $('from').value = qs.get('from'); $('to').value = qs.get('to') || ''; $('preset').value = -1; } else applyPreset();
const prov = qs.get('provider') || localStorage.getItem('provider');
if (prov) { $('provider').value = prov; $('provider').onchange(); }
if (qs.get('tempo')) $('tempo').value = qs.get('tempo');
if (qs.get('autoplay')) start();
</script>
