<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- "Lägg till på hemskärmen" på iPhone/iPad startar sidan i helskärm utan Safaris adressfält -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<title>Gatuvy – åk genom staden</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* hidden video that carries the picture into iPhone's native fullscreen player */
  #fsvideo { position: fixed; width: 2px; height: 2px; left: 0; top: 0; opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + var(--sb)); z-index: 7;
    width: min(420px, calc(100vw - 32px)); background: rgba(18,18,22,.94); border: 1px solid #444;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; display: none; }
  #hint.show { display: block; } #hint button { margin-top: 8px; }
  #panel { position: fixed; top: calc(16px + var(--st)); left: calc(16px + var(--sl)); width: min(380px, calc(100vw - 32px - var(--sl) - var(--sr)));
    max-height: calc(100dvh - 32px - var(--st) - var(--sb)); overflow: auto;
    background: rgba(18,18,22,.88); backdrop-filter: blur(8px); border: 1px solid #333;
    border-radius: 12px; padding: 16px; transition: opacity .4s; z-index: 5; }
  body.collapsed #panel { opacity: 0; pointer-events: none; }
  #min { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; padding: 0; margin: 0; font-size: 20px; line-height: 1; }
  #open { position: fixed; top: calc(14px + var(--st)); left: calc(14px + var(--sl)); width: 44px; height: 44px; padding: 0; margin: 0; z-index: 6;
    border-radius: 50%; background: rgba(18,18,22,.75); border: 1px solid #555; font-size: 20px;
    display: none; transition: opacity .4s; }
  #fs2 { position: fixed; top: calc(14px + var(--st)); right: calc(14px + var(--sr)); width: 44px; height: 44px; padding: 0; margin: 0;
    z-index: 6; border-radius: 50%; background: rgba(18,18,22,.75); border: 1px solid #555; font-size: 20px; display: none; transition: opacity .4s; }
  body.collapsed #open, body.collapsed #fs2 { display: block; }
  body.idle #open, body.idle #fs2 { opacity: 0; } body.idle { cursor: none; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
  input, select, button { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #444;
    background: #1c1c22; color: #eee; font: inherit; }
  button { cursor: pointer; background: #2b6cff; border-color: #2b6cff; font-weight: 600; margin-top: 14px; }
  button.secondary { background: #1c1c22; border-color: #444; font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  #status { margin-top: 12px; font-size: 13px; color: #bbb; min-height: 1.4em; white-space: pre-line; }
  #status.error { color: #ff8a8a; }
  #credit { position: fixed; right: calc(10px + var(--sr)); bottom: calc(8px + var(--sb)); font-size: 11px; color: #ddd;
    background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 6px; z-index: 3; max-width: 70vw; }
  #place { position: fixed; left: calc(16px + var(--sl)); bottom: calc(150px + var(--sb)); font-size: 13px; color: #fff;
    text-shadow: 0 1px 4px #000; z-index: 3; }
  canvas#mini { position: fixed; left: calc(16px + var(--sl)); bottom: calc(16px + var(--sb)); width: 180px; height: 126px;
    background: rgba(0,0,0,.45); border-radius: 10px; z-index: 3; }
  .playing-only { display: none; } body.playing .playing-only { display: block; }
  small { color: #888; }
</style>

<body>
<canvas id="view"></canvas>
<canvas id="mini" class="playing-only" width="360" height="252"></canvas>
<div id="place" class="playing-only"></div>
<div id="credit" class="playing-only"></div>
<video id="fsvideo" muted playsinline webkit-playsinline></video>
<div id="hint"></div>

<button id="open" title="Visa inställningar" aria-label="Visa inställningar">☰</button>
<button id="fs2" title="Helskärm" aria-label="Helskärm">⛶</button>
<div id="panel">
  <button id="min" class="secondary" title="Minimera" aria-label="Minimera panelen">–</button>
  <h1>Gatuvy – åk genom staden</h1>
  <label>Färdig rutt</label>
  <select id="preset"></select>
  <label>Start</label>
  <input id="from" placeholder="Adress eller plats">
  <label>Mål</label>
  <input id="to" placeholder="Adress eller plats">
  <div class="row">
    <div><label>Bildkälla</label>
      <select id="provider">
        <option value="both">Kombinerat (Panoramax + Mapillary)</option>
        <option value="panoramax">Panoramax (öppen, ingen nyckel)</option>
        <option value="mapillary">Mapillary (kräver token)</option>
      </select></div>
    <div><label>Kvalitet</label>
      <select id="quality"><option value="sd">Normal</option><option value="hd">Hög (tyngre)</option></select></div>
  </div>
  <div id="tokenRow" style="display:none">
    <label>Mapillary access token</label>
    <input id="token" placeholder="MLY|...">
  </div>
  <div class="row">
    <div><label>Tempo (sek per bild)</label>
      <select id="tempo"><option>0.5</option><option selected>0.9</option><option>1.5</option><option>2.5</option></select></div>
    <div><label>Musik</label>
      <select id="music">
        <option value="">Ingen</option>
        <option value="https://ice1.somafm.com/groovesalad-128-mp3">Lounge (SomaFM Groove Salad)</option>
        <option value="https://ice1.somafm.com/beatblender-128-mp3">Deep house (SomaFM Beat Blender)</option>
        <option value="https://ice1.somafm.com/lush-128-mp3">Mjuk vokal (SomaFM Lush)</option>
        <option value="custom">Egen ström-URL…</option>
      </select></div>
  </div>
  <input id="musicUrl" placeholder="https://…/stream.mp3" style="display:none; margin-top:8px">
  <button id="go">Starta resan</button>
  <div class="row">
    <button id="fs" class="secondary">Helskärm</button>
    <button id="stop" class="secondary">Stopp</button>
  </div>
  <div id="status"></div>
  <small>Panelen minimeras när resan startar – tryck på ☰ för att öppna den igen. Rutten loopar.</small>
</div>
<audio id="audio" preload="none"></audio>

<script src="extras.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const PRESETS = [
  ['Paris: Louvren → Triumfbågen', 'Musée du Louvre, Paris', 'Arc de Triomphe, Paris'],
  ['Paris: Notre-Dame → Eiffeltornet', 'Notre-Dame de Paris', 'Tour Eiffel, Paris'],
  ['Lyon: Bellecour → Part-Dieu', 'Place Bellecour, Lyon', 'Gare de Lyon-Part-Dieu'],
  ['Nice: Promenade des Anglais', 'Aéroport Nice Côte d\'Azur', 'Place Masséna, Nice'],
  ['Stockholm: Slussen → Odenplan', 'Slussen, Stockholm', 'Odenplan, Stockholm'],
];
PRESETS.forEach((p, i) => $('preset').add(new Option(p[0], i)));
$('preset').add(new Option('Egen rutt…', -1));

// ---------- geo helpers ----------
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) { // metres, equirectangular approximation (fine at city scale)
  const x = rad(b[0] - a[0]) * Math.cos(rad((a[1] + b[1]) / 2)), y = rad(b[1] - a[1]);
  return Math.hypot(x, y) * R;
}
function bearing(a, b) {
  const x = rad(b[0] - a[0]) * Math.cos(rad((a[1] + b[1]) / 2)), y = rad(b[1] - a[1]);
  return (deg(Math.atan2(x, y)) + 360) % 360;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

function resample(coords, step) { // -> [{p:[lon,lat], brg, d}]
  const out = []; let carry = 0, total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i], b = coords[i + 1], len = dist(a, b);
    if (len < 0.01) continue;
    const brg = bearing(a, b);
    for (let s = carry; s < len; s += step) {
      const t = s / len;
      out.push({ p: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], brg, d: total + s });
    }
    carry = (carry - len) % step; if (carry < 0) carry += step;
    total += len;
  }
  // smooth bearing a little so the camera does not snap in corners
  for (let i = 0; i < out.length; i++) {
    let sx = 0, sy = 0;
    for (let k = -3; k <= 3; k++) { const o = out[Math.min(out.length - 1, Math.max(0, i + k))]; sx += Math.sin(rad(o.brg)); sy += Math.cos(rad(o.brg)); }
    out[i].sbrg = (deg(Math.atan2(sx, sy)) + 360) % 360;
  }
  return out;
}

// ---------- external services ----------
async function getJSON(url) {
  const host = new URL(url).host;
  let r;
  try { r = await fetch(url); }
  catch (e) { throw new Error(`Kunde inte nå ${host}. Om sidan visas i en förhandsgranskning eller inbäddad vy blockeras ofta nätverket – öppna den i en vanlig webbläsarflik.`); }
  if (!r.ok) throw new Error(`${host} svarade ${r.status}`);
  return r.json();
}
async function geocode(q) {
  const m = q.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/); // "lat, lon"
  if (m) return [parseFloat(m[3]), parseFloat(m[1])];
  let lastErr;
  try {
    const j = await getJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    if (j.length) return [parseFloat(j[0].lon), parseFloat(j[0].lat)];
  } catch (e) { lastErr = e; console.warn(e); }
  try { // backup geocoder
    const j = await getJSON('https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(q));
    if (j.features && j.features.length) return j.features[0].geometry.coordinates;
  } catch (e) { lastErr = e; console.warn(e); }
  throw lastErr || new Error(`Hittade inte platsen "${q}"`);
}
async function route(a, b) {
  const path = `/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=full&geometries=geojson`;
  // Two public OSRM demo servers; fall back to the second if the first is busy.
  let lastErr;
  for (const base of ['https://router.project-osrm.org', 'https://routing.openstreetmap.de/routed-car']) {
    try { const j = await getJSON(base + path); if (j.code === 'Ok') return j.routes[0]; } catch (e) { lastErr = e; console.warn(e); }
  }
  throw lastErr || new Error('Kunde inte räkna ut en rutt');
}

// Image providers: each returns normalised {id, p:[lon,lat], az, pano, seq, sd, hd, credit}
const providers = {
  async panoramax(bbox) {
    const j = await getJSON(`https://api.panoramax.xyz/api/search?limit=3000&bbox=${bbox.join(',')}`);
    return (j.features || []).map(f => {
      const pr = f.properties, fov = (pr['pers:interior_orientation'] || {}).field_of_view;
      return { src: 'panoramax', id: 'px:' + f.id, p: f.geometry.coordinates, az: pr['view:azimuth'], pano: fov === 360,
        seq: f.collection, sd: f.assets.sd.href, hd: f.assets.hd.href, t: Date.parse(pr.datetime) || 0,
        credit: `${pr['geovisio:producer'] || 'okänd'} · ${pr.license || ''} · Panoramax` };
    });
  },
  async mapillary(bbox) {
    const tok = $('token').value.trim();
    const j = await getJSON('https://graph.mapillary.com/images?limit=2000&fields=id,geometry,compass_angle,computed_compass_angle,is_pano,camera_type,width,height,sequence,thumb_2048_url,thumb_original_url,captured_at,creator'
      + `&bbox=${bbox.join(',')}&access_token=${encodeURIComponent(tok)}`);
    return (j.data || []).map(f => ({ src: 'mapillary', id: 'mly:' + f.id, p: f.geometry.coordinates, az: f.computed_compass_angle ?? f.compass_angle,
      
      pano: !!f.is_pano || f.camera_type === 'spherical' || f.camera_type === 'equirectangular',
      portrait: f.height > f.width, fisheye: f.camera_type === 'fisheye',
      seq: f.sequence, sd: f.thumb_2048_url, hd: f.thumb_original_url || f.thumb_2048_url, t: f.captured_at || 0,
      credit: `${(f.creator || {}).username || 'okänd'} · CC BY-SA · Mapillary` }));
  },
};

// provider: 'panoramax', 'mapillary' or 'both' (Panoramax first, Mapillary fills the gaps)
async function fetchImagesAlong(samples, provider, onProgress) {
  const sources = provider === 'both' ? ['panoramax', 'mapillary'] : [provider];
  // Split the route into ~150 m chunks and ask for the images inside each chunk's padded bounding box.
  const chunks = []; let cur = null, startD = 0;
  for (const s of samples) {
    if (!cur || s.d - startD > 150) { cur = { box: [1e9, 1e9, -1e9, -1e9], samples: [] }; chunks.push(cur); startD = s.d; }
    const c = cur.box; cur.samples.push(s);
    c[0] = Math.min(c[0], s.p[0]); c[1] = Math.min(c[1], s.p[1]);
    c[2] = Math.max(c[2], s.p[0]); c[3] = Math.max(c[3], s.p[1]);
  }
  const byId = new Map(), failed = {}, lastErr = {};
  let done = 0, total = chunks.length * sources.length;
  async function fetchAll(src, list) {
    let next = 0;
    async function worker() {
      while (next < list.length) {
        const ch = list[next++], c = ch.box;
        const padLat = 20 / 111320, padLon = padLat / Math.cos(rad(c[1]));
        const bbox = [c[0] - padLon, c[1] - padLat, c[2] + padLon, c[3] + padLat].map(v => v.toFixed(6));
        try { for (const im of await providers[src](bbox)) if (im.az != null || im.pano) { byId.set(im.id, im); (ch.found ||= []).push(im); } }
        catch (e) { failed[src] = (failed[src] || 0) + 1; lastErr[src] = e; console.warn(e); }
        onProgress(++done, total);
      }
    }
    await Promise.all(Array.from({ length: 8 }, worker));
  }
  // Panoramax first. Mapillary is slow (a couple of seconds per call), so in combined mode it is only
  // asked about the stretches where Panoramax does not already have a photo looking along the road.
  await fetchAll(sources[0], chunks);
  let mlyChunks = 0;
  if (sources[1]) {
    const covered = (ch, s) => (ch.found || []).some(im => dist(s.p, im.p) <= 14 && (im.pano || angDiff(im.az, s.brg) <= 20));
    const todo = chunks.filter(ch => ch.samples.filter(s => covered(ch, s)).length < 0.8 * ch.samples.length);
    total = chunks.length + todo.length; mlyChunks = todo.length;
    await fetchAll(sources[1], todo);
  }
  const dead = sources.filter((src, i) => failed[src] && failed[src] === (i ? mlyChunks : chunks.length));
  if (dead.length === sources.length) throw new Error('Bildkällan svarade inte: ' + (lastErr[dead[0]] || {}).message);
  return { images: [...byId.values()], warnings: dead.map(src => `${src} svarade inte (${(lastErr[src] || {}).message})`) };
}

// Which way was the photographer actually moving, and how fast? Work it out from the neighbouring
// photos in the same capture run. A camera that points away from that direction is a side or rear
// camera, or a phone that was briefly turned towards a building.
const signed = (a, b) => ((a - b + 540) % 360) - 180;
function markForwardFacing(images) {
  const bySeq = new Map();
  for (const im of images) (bySeq.get(im.seq) || bySeq.set(im.seq, []).get(im.seq)).push(im);
  for (const list of bySeq.values()) {
    list.sort((a, b) => a.t - b.t);
    for (let i = 0; i < list.length; i++) {
      const im = list[i];
      // look 1-3 photos back and ahead so tiny GPS jitter does not decide the direction
      let a = null, b = null;
      for (let k = 1; k <= 3 && !a; k++) { const c = list[i - k]; if (c && dist(c.p, im.p) > 2) a = c; }
      for (let k = 1; k <= 3 && !b; k++) { const c = list[i + k]; if (c && dist(c.p, im.p) > 2) b = c; }
      const A = a || im, B = b || im;
      im.move = (a || b) ? bearing(A.p, B.p) : null;
      im.kmh = (a || b) && B.t > A.t ? dist(A.p, B.p) / ((B.t - A.t) / 3.6e6) / 1000 : null;
      im.dev = im.az != null && im.move != null ? signed(im.az, im.move) : null;
    }
    // A camera fixed to a car keeps the same offset all the time; a hand-held phone wanders.
    const devs = list.map(im => im.dev).filter(d => d != null).sort((x, y) => x - y);
    const medDev = devs.length ? devs[devs.length >> 1] : null;
    const speeds = list.map(im => im.kmh).filter(v => v != null && isFinite(v)).sort((x, y) => x - y);
    const medKmh = speeds.length ? speeds[speeds.length >> 1] : null;
    for (const im of list) {
      im.vehicle = medKmh != null && medKmh >= 9;     // faster than walking: car, bus or bike
      im.forward = im.pano || (im.dev != null && medDev != null && Math.abs(medDev) <= 15
        && Math.abs(im.dev) <= 20 && Math.abs(signed(im.dev, medDev)) <= 10);
    }
  }
}

// Score of a whole capture run for this route: how many route points it can serve looking forward.
const FLAT_MAX_TURN = 20; // flat photo may look at most this many degrees away from the road
function usable(im, s) {
  if (im.portrait || im.fisheye) return false;
  if (im.pano) return true;
  return im.forward && angDiff(im.az, s.brg) <= FLAT_MAX_TURN;
}

function buildFrames(samples, images) {
  markForwardFacing(images);
  // Spatial grid (~20 m cells) for nearest-image lookups.
  const lat0 = samples[0].p[1], kx = Math.cos(rad(lat0)) * 111320, ky = 111320, CELL = 20;
  const key = (x, y) => x + ':' + y, grid = new Map();
  for (const im of images) {
    const k = key(Math.floor(im.p[0] * kx / CELL), Math.floor(im.p[1] * ky / CELL));
    (grid.get(k) || grid.set(k, []).get(k)).push(im);
  }
  const near = s => { const cx = Math.floor(s.p[0] * kx / CELL), cy = Math.floor(s.p[1] * ky / CELL), out = [];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const im of grid.get(key(cx + dx, cy + dy)) || [])
      if (dist(s.p, im.p) <= 14 && usable(im, s)) out.push(im);
    return out; };
  const cand = samples.map(near);

  // Is one kind of picture (360° or flat) good enough for the whole route? Then use only that,
  // so the look of the "camera" never changes along the way.
  const cov = kind => cand.filter(c => c.some(im => im.pano === kind)).length / samples.length;
  const covPano = cov(true), covFlat = cov(false);
  const only = covPano >= 0.8 ? true : covFlat >= 0.8 ? false : covPano >= covFlat + 0.25 ? true : covFlat >= covPano + 0.25 ? false : null;

  // Rank every photo: same camera kind first, then Panoramax before Mapillary.
  // Then plan the whole trip at once (a small shortest-path search over the route points):
  //  - using a worse rank costs a little per metre,
  //  - leaving a point without a photo (a jump) costs more per metre,
  //  - every switch of rank costs a lot.
  // Result: short patches of a better source are ignored, short holes are jumped over,
  // and a switch only happens when the new source covers a long stretch.
  const tierOf = im => (only !== null && im.pano !== only ? 2 : 0) + (im.src === 'mapillary' ? 1 : 0);
  const T = 4, RANK_COST = 0.5, HOLE_COST = 3, SWITCH_COST = 15;
  const avail = cand.map(c => { const a = new Array(T).fill(false); c.forEach(im => a[tierOf(im)] = true); return a; });
  const N = samples.length, cost = [], from = [];
  for (let n = 0; n < N; n++) {
    cost.push(new Array(T)); from.push(new Array(T));
    for (let t = 0; t < T; t++) {
      const here = avail[n][t] ? t * RANK_COST : HOLE_COST;
      if (n === 0) { cost[0][t] = here; continue; }
      let best = 1e18, arg = 0;
      for (let u = 0; u < T; u++) { const c = cost[n - 1][u] + (u === t ? 0 : SWITCH_COST); if (c < best) { best = c; arg = u; } }
      cost[n][t] = best + here; from[n][t] = arg;
    }
  }
  const allowed = new Array(N);
  let st = cost[N - 1].indexOf(Math.min(...cost[N - 1]));
  for (let n = N - 1; n >= 0; n--) { allowed[n] = avail[n][st] ? st : -1; if (n) st = from[n][st]; }

  // "Bilder från": prefer the newest or oldest photos, or a season (flipped on the southern hemisphere).
  const ep = GV.opts.epoch || 'any', YEAR = 365.25 * 864e5, south = lat0 < 0;
  let tmin = Infinity, tmax = 0;
  for (const c of cand) for (const im of c) if (im.t) { tmin = Math.min(tmin, im.t); tmax = Math.max(tmax, im.t); }
  const epochCost = im => {
    if (!im.t || ep === 'any') return 0;
    if (ep === 'newest') return (tmax - im.t) / YEAR * 4;
    if (ep === 'oldest') return (im.t - tmin) / YEAR * 4;
    const m = new Date(im.t).getMonth();
    const summer = south ? (m >= 10 || m <= 1) : (m >= 4 && m <= 7), winter = south ? (m >= 5 && m <= 7) : (m >= 10 || m <= 1);
    return (ep === 'summer' ? summer : winter) ? 0 : 10;
  };

  // Long runs from the same capture keep light, season and camera height the same.
  const seqLen = new Map();
  cand.forEach(c => new Set(c.map(im => im.seq)).forEach(q => seqLen.set(q, (seqLen.get(q) || 0) + 1)));

  const frames = []; let prev = null, covered = 0, runDir = 0;
  samples.forEach((s, n) => {

  a.volume = 0.6; a.play().catch(() => {});
}

// override = { from, to, label, tz, city } when the world tour starts a trip; returns true when playing.
async function start(override) {
  if (override instanceof Event) override = null;
  if (!override) {
    GV.emit('manual');
    if (GV.opts.mode === 'world') {
      if (!fsApi && !standalone) vfsPrepare();
      history.replaceState(null, '', '?' + new URLSearchParams({ ...GV.urlParams(), provider: $('provider').value, autoplay: 1 }));
      return GV.startWorld();
    }
  }
  const from = override ? override.from : $('from').value.trim(), to = override ? override.to : $('to').value.trim();
  const hasToken = !!$('token').value.trim();
  // Combined mode without a token simply becomes Panoramax only.
  const provider = $('provider').value === 'both' && !hasToken ? 'panoramax' : $('provider').value;
  if (!from || !to) { status('Ange både start och mål.', true); return false; }
  if (provider === 'mapillary') {
    if (!$('token').value.trim()) { status('Mapillary kräver en access token (gratis på mapillary.com/dashboard/developers).', true); return false; }
    localStorage.setItem('mlyToken', $('token').value.trim());
  }
  run++; document.body.classList.remove('playing'); $('go').disabled = true;
  if (!fsApi && !standalone) vfsPrepare();   // inside the tap, so iPhone allows the video to play
  try {
    status('Söker platser…');
    const a = await geocode(from), b = await geocode(to);
    status('Räknar ut rutt…');
    const r = await route(a, b), coords = r.geometry.coordinates;
    if (r.distance > 40000) throw new Error('Rutten är över 4 mil – välj en kortare sträcka i den här MVP:n.');
    const samples = resample(coords, 4);
    const { images, warnings } = await fetchImagesAlong(samples, provider, (d, n) => status(`Hämtar gatubilder… ${d}/${n}`));
    const { frames, coverage, mixShare } = buildFrames(samples, images);
    if (frames.length < 5) throw new Error(`Hittade för få gatubilder längs rutten (${frames.length}). Prova en annan sträcka eller bildkälla.`);
    const mix = provider === 'both' ? ` · ${Math.round(mixShare * 100)} % från Mapillary` : '';
    status(`${(r.distance / 1000).toFixed(1)} km · ${frames.length} bilder · täckning ${Math.round(coverage * 100)} %${mix}`
      + (warnings.length ? '\nObs: ' + warnings.join('; ') : '')
      + ($('provider').value === 'both' && !hasToken ? '\nUtan Mapillary-token används bara Panoramax.' : ''));
    $('go').disabled = false;
    if (!override) history.replaceState(null, '', '?' + new URLSearchParams({ ...GV.urlParams(), from, to, provider, autoplay: 1 }));
    const label = override?.label || `${from} → ${to}`;
    document.body.classList.add('playing'); startMusic(); setCollapsed(true);
    GV.emit('trip', { coords, frames, label, from, to, tz: override?.tz, city: override?.city });
    play(frames, coords, label);
    return true;
  } catch (e) { console.error(e); status(e.message || String(e), true); $('go').disabled = false; return false; }
}
GV.startTrip = o => start(o);
$('go').onclick = start;

if (!GV.votePage) {
try { initGL(); } catch (e) { status(e.message, true); }
GV.init();
// Kiosk mode: index.html?from=...&to=...&autoplay=1[&provider=mapillary&tempo=0.9]
const qs = new URLSearchParams(location.search);
if (qs.get('from')) { $('from').value = qs.get('from'); $('to').value = qs.get('to') || ''; $('preset').value = -1; } else applyPreset();
const prov = qs.get('provider') || localStorage.getItem('provider') || 'both';
if (prov) { $('provider').value = prov; $('provider').onchange(); }
if (qs.get('tempo')) $('tempo').value = qs.get('tempo');
if (qs.get('autoplay')) start();
}
</script>
